- name: Ensure unattended-upgrades is Installed
  ansible.builtin.package:
    name:
      - unattended-upgrades
    state: present

- name: Ensure unattended-ugprades is Configured
  ansible.builtin.template:
    src: "{{ role_path }}/templates/70unattended-upgrades-local.j2"
    dest: "/etc/apt/apt.conf.d/70unattended-upgrades-local"
    group: root
    owner: root
    mode: "0644"
